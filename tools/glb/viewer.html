<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LR Imports — GLB Viewer</title>
<style>
  html,body{margin:0;height:100%;background:#060709;color:#F4F4F1;font:13px/1.4 system-ui,sans-serif;overflow:hidden}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:10px;opacity:.75}
  #hud a{color:#CDD0D5;margin-right:10px}
</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<div id="hud" style="display:none" data-hide>
  <a href="?model=asad">asad.glb</a>
  <a href="?model=supremacy-collectors-edition">supremacy-collectors-edition.glb</a>
  <a href="?model=lr-imports-logo&dir=brand">lr-imports-logo.glb</a>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const q = new URLSearchParams(location.search);
const model = q.get('model') || 'supremacy-collectors-edition';
const dir = q.get('dir') || 'models';
const shot = q.has('shot');
if (!shot) document.getElementById('hud').style.display = '';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: shot });
renderer.setPixelRatio(shot ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0d0f12');
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.01, 100);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

const key = new THREE.DirectionalLight('#fff4e6', 2.2); key.position.set(2, 3, 3); key.castShadow = true; scene.add(key);
const rim = new THREE.DirectionalLight('#cdd8ff', 2.5); rim.position.set(-3, 2, -3); scene.add(rim);
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: '#101216', roughness: 0.35, metalness: 0.2 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const gltf = await new GLTFLoader().loadAsync(`/public/${dir}/${model}.glb?v=${Date.now()}`);
const root = gltf.scene;
root.traverse((o) => { if (o.isMesh) { o.castShadow = true; } });
scene.add(root);
if (q.has('fit')) { const b0 = new THREE.Box3().setFromObject(root); root.position.y -= b0.min.y; }
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3()), center = box.getCenter(new THREE.Vector3());
const yaw = Number(q.get('yaw') || 25) * Math.PI / 180, pitch = Number(q.get('pitch') || 8) * Math.PI / 180;
const dist = Math.max(size.y, size.x / camera.aspect) / (2 * Math.tan(camera.fov * Math.PI / 360)) * 1.35 * Number(q.get('zoom') || 1);
if (q.get('focus')) { const f = q.get('focus').split(',').map(Number); center.set(f[0], f[1], f[2]); }
camera.position.set(center.x + Math.sin(yaw) * Math.cos(pitch) * dist, center.y + Math.sin(pitch) * dist, center.z + Math.cos(yaw) * Math.cos(pitch) * dist);
controls.target.copy(center);
controls.update();
window.__info = { size: size.toArray(), center: center.toArray() };

renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
window.__ready = true;
</script>
</body>
</html>
